<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA AI – Intelligent Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060813;--panel:rgba(16,20,42,.78);--soft:rgba(255,255,255,.05);--border:rgba(139,148,255,.18);--text:#e9ecff;--muted:#8f95bd;--grad:linear-gradient(135deg,#3b82f6,#8b5cf6);--ai:rgba(255,255,255,.055);--glow:0 0 26px rgba(110,100,255,.5);--o1:rgba(59,130,246,.38);--o2:rgba(139,92,246,.38);--code:#0b0e22}
[data-theme=light]{--bg:#f1f3ff;--panel:rgba(255,255,255,.82);--soft:rgba(79,70,229,.06);--border:rgba(79,70,229,.16);--text:#171a3a;--muted:#5d638c;--ai:rgba(255,255,255,.92);--glow:0 0 20px rgba(99,102,241,.28);--o1:rgba(59,130,246,.22);--o2:rgba(139,92,246,.22);--code:#eceeff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid #8b5cf6;outline-offset:2px}
.orb{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:float 18s ease-in-out infinite}
.o1{background:var(--o1);top:-18vmax;left:-12vmax}.o2{background:var(--o2);bottom:-20vmax;right:-14vmax;animation-delay:-9s}
@keyframes float{50%{transform:translate(6vmax,4vmax) scale(1.1)}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:288px 1fr;height:100%;padding-top:env(safe-area-inset-top,0)}
.side{display:flex;flex-direction:column;gap:14px;padding:18px 14px;background:var(--panel);backdrop-filter:blur(18px);border-right:1px solid var(--border);transition:transform .3s}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:var(--glow);animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(139,92,246,.8)}}
.brand b{font-family:Sora,sans-serif;font-size:19px;letter-spacing:.5px}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.newbtn{padding:12px;border-radius:12px;background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--glow);transition:transform .2s,filter .2s}
.newbtn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.label{font-size:12px;color:var(--muted);padding:2px 8px}
.history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:6px;padding:10px 10px;border-radius:10px;color:var(--muted);text-align:left;font-size:14px;border:1px solid transparent;transition:.2s;cursor:pointer}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover{background:var(--soft);color:var(--text)}
.item.on{background:var(--soft);color:var(--text);border-color:var(--border);box-shadow:inset 3px 0 0 #8b5cf6}
.item .x{opacity:0;padding:0 5px;border-radius:6px}.item:hover .x,.item.on .x{opacity:.7}.item .x:hover{opacity:1;background:rgba(255,80,100,.25)}
.empty{color:var(--muted);font-size:13px;padding:8px;line-height:1.5}
.setbtn{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--soft);transition:.2s}
.setbtn:hover{box-shadow:var(--glow)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(18px)}
.top h1{font:600 16px Sora,sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--soft);color:var(--muted);white-space:nowrap}
.pill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f5b942;margin-right:6px;box-shadow:0 0 8px #f5b942}
.pill.live i{background:#34d399;box-shadow:0 0 8px #34d399}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--soft);font-size:16px;transition:.2s}
.ib:hover{box-shadow:var(--glow);transform:translateY(-1px)}
#menu{display:none}
.chat{flex:1;overflow-y:auto;padding:26px 20px 10px;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:28px 0 6px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero .logo{width:68px;height:68px;font-size:32px;border-radius:20px;margin:0 auto 18px}
.hero h2{font:700 clamp(26px,5vw,40px) Sora,sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.hero p{color:var(--muted);max-width:520px;margin:0 auto 22px;line-height:1.6}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.chip{padding:15px;border-radius:14px;text-align:left;background:var(--soft);border:1px solid var(--border);font-size:14px;line-height:1.45;transition:.25s}
.chip b{display:block;margin-bottom:3px}.chip span{color:var(--muted);font-size:13px}
.chip:hover{transform:translateY(-3px);border-color:#8b5cf6;box-shadow:var(--glow)}
.msg{display:flex;gap:12px;animation:rise .35s ease both}
.msg.user{flex-direction:row-reverse}
.avatar{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--grad);color:#fff}
.user .avatar{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.bubble{max-width:min(680px,82%);padding:13px 16px;border-radius:16px;line-height:1.65;font-size:15px;overflow-wrap:anywhere}
.ai .bubble{background:var(--ai);border:1px solid var(--border);border-top-left-radius:4px;backdrop-filter:blur(10px)}
.user .bubble{background:var(--grad);color:#fff;border-top-right-radius:4px;box-shadow:0 6px 24px rgba(99,102,241,.35);white-space:pre-wrap}
.bubble p+p,.bubble ul+p,.bubble p+ul,.bubble pre+p,.bubble p+pre{margin-top:9px}
.bubble ul{padding-left:20px}
.bubble code{font-family:Consolas,monospace;font-size:13px;background:var(--code);padding:2px 6px;border-radius:6px}
.bubble pre{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:13px;overflow-x:auto;margin-top:9px}
.bubble pre code{padding:0;background:none;white-space:pre}
.tools{margin-top:9px;display:flex;gap:8px}
.copy{font-size:12px;color:var(--muted);padding:4px 10px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.copy:hover{color:var(--text);box-shadow:var(--glow)}
.dots{display:flex;gap:5px;padding:5px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--grad);animation:bounce 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
.dock{padding:10px 20px calc(8px + env(safe-area-inset-bottom,0))}
.box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(18px);transition:.25s}
.box:focus-within{border-color:#8b5cf6;box-shadow:var(--glow)}
textarea{flex:1;resize:none;border:0;background:none;color:var(--text);font:inherit;font-size:15px;line-height:1.5;max-height:150px;padding:8px 0;outline:0}
textarea::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border-radius:13px;background:var(--grad);color:#fff;font-size:18px;box-shadow:var(--glow);transition:.2s}
.send:hover:not(:disabled){transform:scale(1.07)}.send:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 10px}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(3,5,15,.6);backdrop-filter:blur(6px);padding:20px}
.modal.show{display:grid}
.card{width:min(440px,100%);padding:24px;border-radius:20px;background:var(--bg);border:1px solid var(--border);box-shadow:var(--glow);animation:rise .3s ease both}
.card h3{font-family:Sora,sans-serif;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.row small{display:block;color:var(--muted);margin-top:3px;line-height:1.45;max-width:260px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--soft);font-size:13px;white-space:nowrap}
.btn:hover{box-shadow:var(--glow)}.btn.red{border-color:rgba(255,90,110,.5);color:#ff7b8f}
.overlay{display:none}
@media(max-width:800px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:288px;z-index:20;transform:translateX(-100%);padding-top:calc(18px + env(safe-area-inset-top,0))}
 .side.open{transform:none}
 .overlay.show{display:block;position:fixed;inset:0;z-index:15;background:rgba(3,5,15,.6)}
 #menu{display:block}.chips{grid-template-columns:1fr}.bubble{max-width:88%}.top{padding:10px 12px}.chat{padding:18px 12px 6px}.dock{padding:8px 12px calc(6px + env(safe-area-inset-bottom,0))}
 .pill{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">✦</div><div><b>NOVA AI</b><small>Intelligent assistant</small></div></div>
    <button class="newbtn" id="newBtn">＋ New chat</button>
    <div class="label">Chat history</div>
    <div class="history" id="history"></div>
    <button class="setbtn" id="setBtn">⚙ Settings</button>
  </aside>

  <section class="main">
    <header class="top">
      <button class="ib" id="menu" aria-label="Open menu">☰</button>
      <h1 id="title">New chat</h1>
      <span class="pill" id="pill"><i></i>Demo mode</span>
      <button class="ib" id="clearBtn" title="Clear this chat" aria-label="Clear chat">🗑</button>
      <button class="ib" id="themeBtn" title="Toggle light/dark theme" aria-label="Toggle theme">☀</button>
    </header>

    <div class="chat" id="chat"><div class="col" id="messages"></div></div>

    <div class="dock">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask NOVA anything…" aria-label="Message"></textarea>
        <button class="send" id="sendBtn" aria-label="Send message">➤</button>
      </div>
      <p class="note" id="note"></p>
    </div>
    <footer>NOVA AI · AI Assistant Project · Built with HTML, CSS &amp; JavaScript</footer>
  </section>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h3>Settings</h3>
    <div class="row"><div>Theme<small>Switch between dark and light.</small></div><button class="btn" id="themeBtn2">Toggle</button></div>
    <div class="row"><div>AI connection<small id="apiInfo"></small></div></div>
    <div class="row"><div>Delete all chats<small>Removes every saved conversation from this browser.</small></div><button class="btn red" id="wipeBtn">Delete all</button></div>
    <div class="row" style="border:0"><span></span><button class="btn" id="closeBtn">Close</button></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG – connecting a real AI later
   ---------------------------------------------------------
   Never put an API key in this file: anyone can read it.
   Instead, build a small backend (Node, Python, etc.) that
   keeps the key secret, and set its address below.
   Contract: POST { messages:[{role:"user"|"assistant",content:"..."}] }
             →     { reply:"text" }
   ========================================================= */
const CONFIG = { API_ENDPOINT: "" };   // e.g. "https://your-server.com/api/chat"

const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let chats = store.get("nova.chats", []), activeId = store.get("nova.active", null), busy = false;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const active = () => chats.find(c => c.id === activeId);
const persist = () => { store.set("nova.chats", chats); store.set("nova.active", activeId); };

/* ---------- Built-in knowledge (works offline) ---------- */
const DEMO = [
 { k:["hello","hi","hey","who are you","your name","what can you do"], t:"Hello! I’m **NOVA AI**, a student-built AI assistant.\n\nI’m running in **demo mode**: I’m not a full AI model, but I can:\n\n- Answer factual questions by looking them up on **Wikipedia** (needs internet)\n- Do maths, for example *25 * 4 + 10*\n- Tell you the date and time\n- Share study tips, project ideas and sample code\n\nTry asking *“Who is Albert Einstein?”* or *“What is photosynthesis?”*" },
 { k:["thanks","thank you"], t:"You’re welcome! Ask me anything else." },
 { k:["joke","funny"], t:"Why do programmers prefer dark mode?\n\nBecause light attracts bugs." },
 { k:["(best|top|greatest).*(football|soccer)","(football|soccer).*(best|top|greatest)"], t:"Greatest-of-all-time lists are opinion-based, but these ten names appear on most football lists:\n\n- **Pelé** (Brazil): three World Cups\n- **Diego Maradona** (Argentina): carried Argentina to the 1986 World Cup\n- **Lionel Messi** (Argentina): record eight Ballon d’Ors and the 2022 World Cup\n- **Cristiano Ronaldo** (Portugal): one of the all-time top goalscorers\n- **Johan Cruyff** (Netherlands): the face of “Total Football”\n- **Franz Beckenbauer** (Germany): redefined the sweeper role\n- **Zinedine Zidane** (France): the 1998 World Cup and Euro 2000\n- **Ronaldo Nazário** (Brazil): two World Cups\n- **Alfredo Di Stéfano** (Argentina/Spain): the engine of Real Madrid’s early European Cups\n- **Michel Platini** (France): three Ballon d’Ors in a row\n\nWho ranks where is debated. Ask about any of them by name and I’ll look them up.\n\n*(Built-in answer, not live data.)*" },
 { k:["python","code","coding","function","program","script","javascript"], t:"Here is a simple Python function that checks for palindromes:\n\n```python\ndef is_palindrome(text):\n    cleaned = \"\".join(c.lower() for c in text if c.isalnum())\n    return cleaned == cleaned[::-1]\n\nprint(is_palindrome(\"Never odd or even\"))  # True\n```\n\nIt removes spaces and punctuation, lowercases everything, then compares the text with its reverse." },
 { k:["study","exam","exams","revision"], t:"Here is a study routine that works well:\n\n- **Plan**: split the syllabus into small daily goals\n- **Focus**: study in 25-minute blocks with 5-minute breaks\n- **Recall**: quiz yourself instead of rereading\n- **Review**: revisit notes after 1 day, 3 days and 1 week\n- **Rest**: sleep matters more than a late-night cram" },
 { k:["project ideas?","ideas? for"], t:"Here are three project ideas you could build next:\n\n- **Smart study planner** that schedules revision around your exam dates\n- **Campus helper bot** answering common student questions\n- **Habit tracker** with charts and streaks\n\nEach one can start as simple HTML, CSS and JavaScript, then grow with a backend." }
];
const FALLBACK = "I couldn’t find an answer to that. I’m a demo without a full AI model, so I rely on built-in topics, maths, and Wikipedia lookups (which need an internet connection).\n\nTry rephrasing with the name of a person, place or concept, for example *“Who is Lionel Messi?”*. Connecting a real AI model through a backend would let me answer anything.";
const hit = (q, k) => new RegExp("\\b" + k + "\\b", "i").test(q);
const localReply = q => { const m = DEMO.find(d => d.k.some(k => hit(q, k))); return m ? m.t : null; };

function calc(q){
  const m = q.replace(/[?=]/g,"").replace(/^(what is|what’s|what's|calculate|compute|solve)\s+/i,"").replace(/x/gi,"*").replace(/\^/g,"**").trim();
  if (!/^[\d\s+\-*/().%]+$/.test(m) || !/\d\s*(\*\*|[-+*/%])\s*[\d(]/.test(m)) return null;
  try { const v = Function('"use strict";return (' + m + ")")(); if (typeof v === "number" && isFinite(v)) return "**" + m.replace(/\*\*/g,"^").replace(/\*/g,"×") + " = " + +v.toFixed(10) + "**"; } catch(e){}
  return null;
}
function clock(q){
  if (!/\b(what time|current time|time now|today’s date|today's date|what day|what is the date|what’s the date|date today)\b/i.test(q)) return null;
  return "Right now it is **" + new Date().toLocaleString(undefined, { dateStyle:"full", timeStyle:"short" }) + "** on your device.";
}
function topicOf(q){
  return q.replace(/[?!.]+$/,"").replace(/^(please\s+)?(can you\s+)?(tell me|explain|describe|define|what['’]?s?( is| are| was| were)?|who['’]?s?( is| was| are)?|where['’]?s?( is)?|when (was|is|did)|how (does|do|did)|why (is|are|does|do|did))\s+(about\s+|me\s+)?(the\s+|a\s+|an\s+)?/i,"").trim() || q;
}
async function wiki(q){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
  try {
    const u = "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent(topicOf(q)) + "&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=4&format=json&origin=*";
    const j = await (await fetch(u, { signal: ctl.signal })).json();
    const p = j.query && Object.values(j.query.pages)[0];
    if (p && p.extract) return p.extract.trim() + "\n\n*Source: Wikipedia, “" + p.title + "”. NOVA looked this up online.*";
  } catch(e){} finally { clearTimeout(t); }
  return null;
}

/* ---------- AI layer: swap this to use a real API ---------- */
async function getAIResponse(messages){
  if (CONFIG.API_ENDPOINT){
    const r = await fetch(CONFIG.API_ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ messages: messages.map(m => ({ role: m.role === "ai" ? "assistant" : "user", content: m.content })) }) });
    if (!r.ok) throw new Error("Server responded with status " + r.status);
    return (await r.json()).reply;
  }
  const q = messages[messages.length - 1].content;
  await wait(500 + Math.random() * 500);
  return calc(q) || clock(q) || localReply(q) || await wiki(q) || FALLBACK;
}

/* ---------- Safe mini-markdown ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  let out = "", list = false;
  for (const l of s.split("\n")){
    const m = l.match(/^\s*[-•]\s+(.*)/);
    if (m){ if(!list){ out += "<ul>"; list = true; } out += "<li>" + m[1] + "</li>"; }
    else { if(list){ out += "</ul>"; list = false; } if (l.trim()) out += "<p>" + l + "</p>"; }
  }
  return out + (list ? "</ul>" : "");
}
const md = t => t.split("```").map((p,i) => i % 2 ? "<pre><code>" + esc(p.replace(/^\w*\n/,"")) + "</code></pre>" : inline(esc(p))).join("");

/* ---------- Rendering ---------- */
const scroll = () => { const c = $("#chat"); c.scrollTop = c.scrollHeight; };
const PROMPTS = [
  ["Explain AI simply","What is artificial intelligence?"],
  ["Write Python code","Write a Python function to check a palindrome"],
  ["Study tips","Give me tips to study for exams"],
  ["Project ideas","Suggest some project ideas I can build"]
];
function hero(){
  const h = document.createElement("div"); h.className = "hero"; h.id = "hero";
  h.innerHTML = '<div class="logo">✦</div><h2>Hello, I’m NOVA</h2><p>Your AI assistant for learning, coding and ideas. Ask me anything, or start with one of these.</p><div class="chips"></div>';
  PROMPTS.forEach(([a,q]) => { const b = document.createElement("button"); b.className = "chip"; b.innerHTML = "<b></b><span></span>"; b.firstChild.textContent = a; b.lastChild.textContent = q; b.onclick = () => send(q); h.querySelector(".chips").appendChild(b); });
  return h;
}
function addMsg(role, text){
  const w = document.createElement("div"); w.className = "msg " + role; w.dataset.raw = text;
  w.innerHTML = '<div class="avatar">' + (role === "ai" ? "✦" : "You") + '</div><div class="bubble"><div class="content"></div></div>';
  const c = w.querySelector(".content");
  if (role === "ai") c.innerHTML = md(text); else c.textContent = text;
  $("#messages").appendChild(w); scroll(); return w;
}
function addTools(w){ const t = document.createElement("div"); t.className = "tools"; t.innerHTML = '<button class="copy">⧉ Copy</button>'; w.querySelector(".bubble").appendChild(t); }
function renderMessages(){
  const box = $("#messages"); box.innerHTML = ""; const c = active();
  if (!c || !c.messages.length){ box.appendChild(hero()); return; }
  c.messages.forEach(m => { const w = addMsg(m.role, m.content); if (m.role === "ai") addTools(w); });
}
function renderHistory(){
  const h = $("#history"); h.innerHTML = "";
  const list = chats.filter(c => c.messages.length);
  if (!list.length){ h.innerHTML = '<div class="empty">No conversations yet. Send a message to start one.</div>'; return; }
  list.forEach(c => {
    const b = document.createElement("div"); b.className = "item" + (c.id === activeId ? " on" : ""); b.tabIndex = 0;
    b.innerHTML = "<span></span><button class='x' title='Delete chat' aria-label='Delete chat'>✕</button>";
    b.firstChild.textContent = "💬 " + c.title;
    b.onclick = e => { if (e.target.closest(".x")){ deleteChat(c.id); } else { activeId = c.id; persist(); render(); closeSide(); } };
    b.onkeydown = e => { if (e.key === "Enter") b.click(); };
    h.appendChild(b);
  });
}
function render(){ const c = active(); $("#title").textContent = c ? c.title : "New chat"; renderHistory(); renderMessages(); }

/* ---------- Chat actions ---------- */
function newChat(){
  const cur = active();
  if (!(cur && !cur.messages.length)){ const c = { id: uid(), title: "New chat", messages: [] }; chats.unshift(c); activeId = c.id; persist(); }
  render(); closeSide(); $("#input").focus();
}
function deleteChat(id){ chats = chats.filter(c => c.id !== id); if (activeId === id) activeId = null; if (!active()) newChat(); else { persist(); render(); } persist(); }
function clearChat(){
  const c = active(); if (!c || !c.messages.length) return;
  if (confirm("Clear all messages in this chat?")){ c.messages = []; c.title = "New chat"; persist(); render(); }
}
async function send(text){
  text = (text ?? $("#input").value).trim();
  if (!text || busy) return;
  if (!active()) newChat();
  const c = active(); busy = true; $("#sendBtn").disabled = true;
  if (!c.messages.length){ c.title = text.length > 30 ? text.slice(0, 30) + "…" : text; $("#title").textContent = c.title; }
  const hr = $("#hero"); if (hr) hr.remove();
  c.messages.push({ role:"user", content:text }); addMsg("user", text);
  $("#input").value = ""; autosize(); persist(); renderHistory();
  const typing = addMsg("ai", ""); typing.querySelector(".content").innerHTML = '<div class="dots"><i></i><i></i><i></i></div>'; scroll();
  let reply;
  try { reply = await getAIResponse(c.messages); }
  catch (err) { reply = "**Connection problem.** I couldn’t reach the AI server (" + err.message + "). Check that your backend is running and CONFIG.API_ENDPOINT is correct."; }
  const words = reply.split(/(\s+)/), content = typing.querySelector(".content");
  for (let i = 3; i < words.length + 3; i += 3){ content.innerHTML = md(words.slice(0, i).join("")); scroll(); await wait(28); }
  typing.dataset.raw = reply; addTools(typing);
  c.messages.push({ role:"ai", content:reply }); persist(); renderHistory();
  busy = false; $("#sendBtn").disabled = false; $("#input").focus(); scroll();
}

/* ---------- UI wiring ---------- */
function setTheme(t){ document.documentElement.dataset.theme = t; store.set("nova.theme", t); $("#themeBtn").textContent = t === "dark" ? "☀" : "☾"; }
const toggleTheme = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
const closeSide = () => { $("#side").classList.remove("open"); $("#overlay").classList.remove("show"); };
function autosize(){ const i = $("#input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 150) + "px"; }
async function copyText(t, btn){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); }catch(_){} a.remove(); }
  btn.textContent = "✓ Copied"; setTimeout(() => btn.textContent = "⧉ Copy", 1600);
}

$("#sendBtn").onclick = () => send();
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("#input").addEventListener("input", autosize);
$("#newBtn").onclick = newChat;
$("#clearBtn").onclick = clearChat;
$("#themeBtn").onclick = toggleTheme; $("#themeBtn2").onclick = toggleTheme;
$("#menu").onclick = () => { $("#side").classList.add("open"); $("#overlay").classList.add("show"); };
$("#overlay").onclick = closeSide;
$("#setBtn").onclick = () => $("#modal").classList.add("show");
$("#closeBtn").onclick = () => $("#modal").classList.remove("show");
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").classList.remove("show"); };
document.addEventListener("keydown", e => { if (e.key === "Escape"){ $("#modal").classList.remove("show"); closeSide(); } });
$("#wipeBtn").onclick = () => { if (confirm("Delete ALL saved chats?")){ chats = []; activeId = null; newChat(); $("#modal").classList.remove("show"); } };
$("#messages").addEventListener("click", e => { const b = e.target.closest(".copy"); if (b) copyText(b.closest(".msg").dataset.raw, b); });

/* ---------- Start ---------- */
const live = !!CONFIG.API_ENDPOINT;
$("#pill").className = "pill" + (live ? " live" : ""); $("#pill").innerHTML = "<i></i>" + (live ? "Live AI" : "Demo mode");
$("#note").textContent = live ? "NOVA AI can make mistakes. Check important information." : "Demo mode: built-in answers plus Wikipedia lookups. Not a full AI model.";
$("#apiInfo").textContent = live ? "Connected to your backend endpoint." : "Demo mode: built-in answers plus Wikipedia lookups. Set CONFIG.API_ENDPOINT in the code to connect a real AI through your own server.";
setTheme(store.get("nova.theme", "dark"));
if (!active()) { activeId = null; newChat(); } else render();
</script>
</body>
</html>
